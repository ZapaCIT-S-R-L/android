[versions]
agp = "9.4.1"
kotlin = "2.4.21"
detekt = "1.23.8"
ktlintGradle = "14.2.0"
cyclonedx = "3.5.1"
ktlint-cli = "1.8.0"
compose-bom = "2026.09.00"
activity-compose = "1.13.0"
core-ktx = "1.19.1"
lifecycle = "2.11.0"
junit = "4.13.2"
androidx-test-junit = "1.3.0"
androidx-test-runner = "1.7.0"
# Espresso 3.7 works on Android 17 (API 37) images; older ones call the removed InputManager.getInstance().
espresso = "3.7.0"
credentials = "1.6.0"
googleid = "1.2.1"
age-signals = "0.0.4"
play-integrity = "1.6.0"
libsignal = "0.106.0"
blockstore = "16.4.0"
desugar-jdk-libs = "2.1.5"
okhttp = "5.5.1"
kotlinx-serialization = "1.12.0"
kotlinx-coroutines = "1.11.0"
browser = "1.10.0"
# Encrypted chat database (SQLCipher community edition, BSD-style licence).
sqlcipher = "4.20.0"
androidx-sqlite = "2.7.1"
# QR codes: draw (ZXing, Apache-2.0) and scan (Google code scanner: camera in Play services, no camera permission).
zxing = "3.5.4"
code-scanner = "16.1.0"
# WebRTC with FrameCryptor (end-to-end encrypted frames), BSD-3-Clause. github.com/webrtc-sdk/android
webrtc = "150.7871.04"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-credentials = { module = "androidx.credentials:credentials", version.ref = "credentials" }
androidx-credentials-play-services = { module = "androidx.credentials:credentials-play-services-auth", version.ref = "credentials" }
googleid = { module = "com.google.android.libraries.identity.googleid:googleid", version.ref = "googleid" }
play-age-signals = { module = "com.google.android.play:age-signals", version.ref = "age-signals" }
play-integrity = { module = "com.google.android.play:integrity", version.ref = "play-integrity" }
desugar-jdk-libs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugar-jdk-libs" }
play-services-blockstore = { module = "com.google.android.gms:play-services-auth-blockstore", version.ref = "blockstore" }
libsignal-android = { module = "org.signal:libsignal-android", version.ref = "libsignal" }
androidx-browser = { module = "androidx.browser:browser", version.ref = "browser" }
webrtc = { module = "io.github.webrtc-sdk:android", version.ref = "webrtc" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
play-code-scanner = { module = "com.google.android.gms:play-services-code-scanner", version.ref = "code-scanner" }
sqlcipher-android = { module = "net.zetetic:sqlcipher-android", version.ref = "sqlcipher" }
androidx-sqlite = { module = "androidx.sqlite:sqlite", version.ref = "androidx-sqlite" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver3", version.ref = "okhttp" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-play-services = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-play-services", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintGradle" }
cyclonedx = { id = "org.cyclonedx.bom", version.ref = "cyclonedx" }
